<div class="container mt-3 p-3">
  <div class="text-center">
    <h2 class="p-3">
      <i class="fa-solid fa-box" style="color:#0039a5;"></i> {{ title }}
    </h2>
  </div>

  <div *ngIf="cargarFormulario">
    <form [formGroup]="formItem">
      <!-- Type + Name -->
      <div class="row p-2">
        <div class="form-group col-md-4 mb-3">
          <label>{{ 'QUICKBOOKS.FORM_ITEM_TYPE' | translate }} *</label>
          <select class="form-control" formControlName="type">
            <option *ngFor="let t of typeOptions" [value]="t.value">{{ t.label }}</option>
          </select>
          <small class="text-muted" *ngIf="isEdit">
            {{ 'QUICKBOOKS.TYPE_IMMUTABLE_HINT' | translate }}
          </small>
        </div>
        <div class="form-group col-md-8 mb-3">
          <label>{{ 'QUICKBOOKS.FORM_ITEM_NAME' | translate }} *</label>
          <input type="text" class="form-control" formControlName="name"
            [placeholder]="'QUICKBOOKS.FORM_ITEM_NAME_PLACEHOLDER' | translate">
          <div *ngIf="formItem.get('name').invalid && formItem.get('name').touched"
            class="text-danger small">
            {{ 'QUICKBOOKS.FORM_DISPLAY_NAME_REQUIRED' | translate }}
          </div>
        </div>
      </div>

      <!-- SKU + Income Account -->
      <div class="row p-2">
        <div class="form-group col-md-4 mb-3">
          <label>{{ 'QUICKBOOKS.TABLE_SKU' | translate }}</label>
          <input type="text" class="form-control" formControlName="sku"
            [placeholder]="'QUICKBOOKS.FORM_ITEM_SKU_PLACEHOLDER' | translate">
        </div>
        <div class="form-group col-md-8 mb-3">
          <label>{{ 'QUICKBOOKS.FORM_INCOME_ACCOUNT' | translate }} *</label>
          <select class="form-control" formControlName="incomeAccountRef">
            <option value="" disabled>
              {{ loadingAccounts ? ('QUICKBOOKS.LOADING_ACCOUNTS' | translate) : ('QUICKBOOKS.SELECT_ACCOUNT' | translate) }}
            </option>
            <option *ngFor="let a of filteredIncomeAccounts" [value]="a.Id">
              {{ (a.FullyQualifiedName || a.Name).split(':').join(' : ') }}
            </option>
          </select>
          <div *ngIf="formItem.get('incomeAccountRef').invalid && formItem.get('incomeAccountRef').touched"
            class="text-danger small">
            {{ 'QUICKBOOKS.FORM_DISPLAY_NAME_REQUIRED' | translate }}
          </div>
        </div>
      </div>

      <!-- Description -->
      <div class="row p-2">
        <div class="form-group col-md-12 mb-3">
          <label>{{ 'QUICKBOOKS.FORM_DESCRIPTION' | translate }}</label>
          <textarea class="form-control" formControlName="description" rows="2"></textarea>
        </div>
      </div>

      <!-- Unit Price + Purchase Cost -->
      <div class="row p-2">
        <div class="form-group col-md-6 mb-3">
          <label>{{ 'QUICKBOOKS.FORM_UNIT_PRICE' | translate }}</label>
          <input type="number" min="0" step="0.01" class="form-control" formControlName="unitPrice"
            placeholder="0.00">
        </div>
        <div class="form-group col-md-6 mb-3">
          <label>{{ 'QUICKBOOKS.FORM_PURCHASE_COST' | translate }}</label>
          <input type="number" min="0" step="0.01" class="form-control" formControlName="purchaseCost"
            placeholder="0.00">
        </div>
      </div>

      <!-- Campos extra solo para Inventory (al crear) -->
      <ng-container *ngIf="!isEdit && formItem.get('type').value === 'Inventory'">
        <div class="row p-2">
          <div class="form-group col-md-6 mb-3">
            <label>{{ 'QUICKBOOKS.FORM_ASSET_ACCOUNT' | translate }} *</label>
            <select class="form-control" formControlName="assetAccountRef">
              <option value="" disabled>{{ 'QUICKBOOKS.SELECT_ACCOUNT' | translate }}</option>
              <option *ngFor="let a of assetAccounts" [value]="a.Id">
                {{ (a.FullyQualifiedName || a.Name).split(':').join(' : ') }}
              </option>
            </select>
          </div>
          <div class="form-group col-md-6 mb-3">
            <label>{{ 'QUICKBOOKS.FORM_EXPENSE_ACCOUNT' | translate }} *</label>
            <select class="form-control" formControlName="expenseAccountRef">
              <option value="" disabled>{{ 'QUICKBOOKS.SELECT_ACCOUNT' | translate }}</option>
              <option *ngFor="let a of expenseAccounts" [value]="a.Id">
                {{ (a.FullyQualifiedName || a.Name).split(':').join(' : ') }}
              </option>
            </select>
          </div>
        </div>
        <div class="row p-2">
          <div class="form-group col-md-6 mb-3">
            <label>{{ 'QUICKBOOKS.FORM_INITIAL_QTY' | translate }}</label>
            <input type="number" min="0" step="1" class="form-control" formControlName="qtyOnHand"
              placeholder="0">
          </div>
          <div class="form-group col-md-6 mb-3">
            <label>{{ 'QUICKBOOKS.FORM_INV_START_DATE' | translate }}</label>
            <input type="date" class="form-control" formControlName="invStartDate">
          </div>
        </div>
      </ng-container>

      <!-- Taxable -->
      <div class="row p-2">
        <div class="form-group col-md-6 mb-3">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="chkTaxable" formControlName="taxable">
            <label class="form-check-label" for="chkTaxable">
              {{ 'QUICKBOOKS.FORM_TAXABLE' | translate }}
            </label>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="row justify-content-center p-3">
        <button (click)="save()" class="btn btn-outline-primary col-md-4 me-2" [disabled]="saving">
          <i class="fa-solid fa-floppy-disk" *ngIf="!saving"></i>
          <span class="spinner-border spinner-border-sm" *ngIf="saving"></span>
          {{ (saving ? 'QUICKBOOKS.SAVING' : 'GENERAL.SAVE') | translate }}
        </button>
        <button (click)="bsModalRef.hide()" class="btn btn-outline-secondary col-md-4" [disabled]="saving">
          <i class="fa-solid fa-ban" style="color: red"></i> {{ 'GENERAL.CLOSE' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
