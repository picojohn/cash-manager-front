<div class="container mt-3 p-3">
  <div class="text-center">
    <h2 class="p-3">
      <i class="fa-solid fa-user" style="color:#0039a5;"></i> {{ title }}
    </h2>
  </div>
  <div *ngIf="cargarFormulario">
    <form [formGroup]="formCustomer">
      <!-- Display Name -->
      <div class="row p-2">
        <div class="form-group col-md-12 mb-3">
          <label for="displayName">{{ 'QUICKBOOKS.FORM_DISPLAY_NAME' | translate }} *</label>
          <input type="text" class="form-control" formControlName="displayName"
            [placeholder]="'QUICKBOOKS.FORM_DISPLAY_NAME_PLACEHOLDER' | translate">
          <div *ngIf="formCustomer.get('displayName').invalid && formCustomer.get('displayName').touched"
            class="text-danger small">
            {{ 'QUICKBOOKS.FORM_DISPLAY_NAME_REQUIRED' | translate }}
          </div>
        </div>
      </div>

      <!-- Company Name -->
      <div class="row p-2">
        <div class="form-group col-md-12 mb-3">
          <label for="companyName">{{ 'QUICKBOOKS.FORM_COMPANY' | translate }}</label>
          <input type="text" class="form-control" formControlName="companyName"
            [placeholder]="'QUICKBOOKS.FORM_COMPANY_PLACEHOLDER' | translate">
        </div>
      </div>

      <!-- Given + Family -->
      <div class="row p-2">
        <div class="form-group col-md-6 mb-3">
          <label for="givenName">{{ 'QUICKBOOKS.FORM_GIVEN_NAME' | translate }}</label>
          <input type="text" class="form-control" formControlName="givenName"
            [placeholder]="'QUICKBOOKS.FORM_GIVEN_NAME_PLACEHOLDER' | translate">
        </div>
        <div class="form-group col-md-6 mb-3">
          <label for="familyName">{{ 'QUICKBOOKS.FORM_FAMILY_NAME' | translate }}</label>
          <input type="text" class="form-control" formControlName="familyName"
            [placeholder]="'QUICKBOOKS.FORM_FAMILY_NAME_PLACEHOLDER' | translate">
        </div>
      </div>

      <!-- Email + Phone -->
      <div class="row p-2">
        <div class="form-group col-md-6 mb-3">
          <label for="email">{{ 'GENERAL.EMAIL' | translate }}</label>
          <input type="email" class="form-control" formControlName="email"
            [placeholder]="'QUICKBOOKS.FORM_EMAIL_PLACEHOLDER' | translate">
          <div *ngIf="formCustomer.get('email').invalid && formCustomer.get('email').touched"
            class="text-danger small">
            {{ 'QUICKBOOKS.FORM_EMAIL_INVALID' | translate }}
          </div>
        </div>
        <div class="form-group col-md-6 mb-3">
          <label for="phone">{{ 'GENERAL.PHONE' | translate }}</label>
          <input type="text" class="form-control" formControlName="phone"
            [placeholder]="'QUICKBOOKS.FORM_PHONE_PLACEHOLDER' | translate">
        </div>
      </div>

      <!-- Botones -->
      <div class="row justify-content-center p-3">
        <button (click)="save()" class="btn btn-outline-primary col-md-4 me-2" [disabled]="saving">
          <i class="fa-solid fa-floppy-disk" *ngIf="!saving"></i>
          <span class="spinner-border spinner-border-sm" *ngIf="saving"></span>
          {{ (saving ? 'QUICKBOOKS.SAVING' : 'GENERAL.SAVE') | translate }}
        </button>
        <button (click)="bsModalRef.hide()" class="btn btn-outline-secondary col-md-4" [disabled]="saving">
          <i class="fa-solid fa-ban" style="color: red"></i> {{ 'GENERAL.CLOSE' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
