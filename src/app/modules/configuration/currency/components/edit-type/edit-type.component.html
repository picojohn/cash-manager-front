<div class="container p-3">
  <div class="row justify-content-center">
    <div class="row justify-content-center text-center">
      <h3 class="p-3 col-md-12"><i class="fa-solid fa-coins" id="icon_subtitle"></i>
        {{title}}</h3>
    </div>
  </div>
  <div *ngIf="cargarFormularioBooleam">
    <form [formGroup]="formType">

      <div class="row justify-content-center px-3">
        <div class="card_form col-md-8">
          <div class="row">
            <div class="card_form col-md-7">
              <div class="form-group">
                <label> Nombre </label>
                <input type="text" class="form-control" formControlName="name" placeholder="Nombre">
                <div *ngIf="formType.controls.name.touched && formType.controls.name.errors?.required"
                  class="text text-danger">
                  * El nombre del tipo es requerido
                </div>
              </div>
            </div>

          </div>
        </div>
        <div class="card_select p-3 col-md-10">
        </div>
        <div class="row justify-content-between p-3 col-md-10">
          <button (click)="saveData()" class="btn btn-outline-primary btn-ms btn-block col-md-5">
            <i class="fa-solid fa-floppy-disk" ></i><strong> Guardar</strong>
          </button>
          <button (click)="bsModalRef.hide()" class="btn btn-outline-secondary btn-ms btn-block col-md-5">
            <i class="fa-solid fa-ban" id="icon_cancel"></i><strong> Cerrar</strong>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
