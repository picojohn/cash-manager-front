<div class="container p-3">
  <div class="row justify-content-center">
    <div class="row justify-content-center text-center">
      <h2 class="p-3 col-md-6"><i class="fa-solid fa-id-badge" id="icon_subtitle"></i>
        {{title}}</h2>
    </div>
  </div>
  <div *ngIf="cargarFormularioBooleam">
    <form [formGroup]="formSubModule">

      <div class="row justify-content-center px-5">

        <div class="card_form col-md-6 mb-3">
          <div class="form-group">
            <label> {{ 'GENERAL.NAME' | translate }} </label>
            <input type="text" class="form-control" formControlName="name" [placeholder]="'PANEL.SUBMODULES.NAME_PLACEHOLDER' | translate">
            <div *ngIf="formSubModule.controls.name.touched && formSubModule.controls.name.errors?.required"
              class="text text-danger">
              {{ 'PANEL.SUBMODULES.NAME_REQUIRED' | translate }}
            </div>
          </div>
        </div>

        <div class="card_form col-md-6 mb-3">
          <div class="form-group">
            <label> {{ 'PANEL.SUBMODULES.URL_LABEL' | translate }} </label>
            <input type="text" class="form-control" formControlName="path" [placeholder]="'PANEL.SUBMODULES.URL_PLACEHOLDER' | translate">
            <div *ngIf="formSubModule.controls.path.touched && formSubModule.controls.path.errors?.required"
              class="text text-danger">
              {{ 'PANEL.SUBMODULES.URL_REQUIRED' | translate }}
            </div>
          </div>
        </div>

        <div class="card_form col-md-6">
          <div class="form-group">
            <label>{{ 'PANEL.SUBMODULES.ICON_LABEL' | translate }}</label>
            <ng-select formControlName="icon" [items]="freeIcons" [placeholder]="'PANEL.SUBMODULES.ICON_PLACEHOLDER' | translate">
              <ng-template ng-option-tmp let-item="item">
                <i [class]="item"></i> {{ item }}
              </ng-template>
              <ng-template ng-label-tmp let-item="item">
                <i [class]="item"></i> {{ item }}
              </ng-template>
            </ng-select>
            <div *ngIf="formSubModule.controls.icon.touched && formSubModule.controls.icon.errors?.required"
              class="text text-danger">
              {{ 'PANEL.SUBMODULES.ICON_REQUIRED' | translate }}
            </div>
          </div>
        </div>

        <div class="card_form col-md-6">
          <div class="form-group">
            <label> {{ 'PANEL.SUBMODULES.MODULE_LABEL' | translate }} </label>
            <ng-select [items]="modules" bindLabel="name" bindValue="id" formControlName="idModule" >
            </ng-select>
            <div *ngIf="formSubModule.controls.idModule.touched && formSubModule.controls.idModule.errors?.required"
              class="text text-danger">
              {{ 'PANEL.SUBMODULES.MODULE_REQUIRED' | translate }}
            </div>
          </div>
        </div>


        <div class="card_select p-3 col-md-10">
        </div>
        <div class="row justify-content-between p-3 col-md-10">
          <button (click)="saveData()" class="btn btn-outline-primary btn-ms btn-block col-md-5">
            <i class="fa-solid fa-floppy-disk" style="color: #0a3754"></i><strong> {{ 'GENERAL.SAVE' | translate }}</strong>
          </button>
          <button (click)="bsModalRef.hide()" class="btn btn-outline-secondary btn-ms btn-block col-md-5">
            <i class="fa-solid fa-ban" id="icon_cancel"></i><strong> {{ 'GENERAL.CLOSE' | translate }}</strong>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
