<div class="container mt-5 p-3">
  <div class="row justify-content-center">
    <div class="text-center">
      <h2 class="p-3 col-md-12"><i class="fa-solid fa-chalkboard-user" style="font-size: 25px; color:#0039a5;"></i>
        {{ title }}</h2>
    </div>
  </div>

  <div *ngIf="cargarFormularioMenuPermiso">
    <form [formGroup]="formMenuPermisos">
      <div class="row justify-content-center p-3">
        <div class="form-group text-center col-md-6 mb-3">
          <label>
            <p><i class="fa-solid fa-user-shield" style="font-size: 25px; color:#0039a5;"></i>
              <span style="color: gray"> Rol:</span>
              <strong style="color: #0039a5;"> {{role?.name}}</strong>
            </p>
          </label>
        </div>
      </div>

      <div formArrayName="opciones">
        <div *ngFor="let itemModule of formMenuPermisos.get('opciones')['controls']; let i = index" [formGroupName]="i">
          <div class="module-card mb-4">
            <div class="module-header">
              <i [ngClass]="['fa-solid', itemModule.value?.iconModule]"></i>
              {{ itemModule.value.nameModule }}
            </div>

            <div formArrayName="subModules" class="row p-3 g-3">
              <div class="col-md-4 col-sm-6"
                *ngFor="let itemSubmodule of itemModule.get('subModules')['controls']; let j = index"
                [formGroupName]="j">
                <div class="submodule-card" [class.submodule-active]="itemSubmodule.value.mostrarAdicionales">
                  <div class="submodule-header">
                    <input class="form-check-input" type="checkbox" formControlName="mostrarAdicionales">
                    <i [ngClass]="['fa-solid', itemSubmodule.value?.iconSubModule]" class="submodule-icon"></i>
                    <strong>{{ itemSubmodule.value.nameSubModule }}</strong>
                  </div>

                  <div *ngIf="itemSubmodule.value.mostrarAdicionales" class="submodule-actions" formArrayName="actions">
                    <div class="action-item"
                      *ngFor="let action of itemSubmodule.get('actions').controls; let k = index"
                      [formGroupName]="k">
                      <input class="form-check-input" type="checkbox" formControlName="status">
                      <label class="action-label">{{ action.value.name }}</label>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row justify-content-center gap-3 p-3">
        <button (click)="guardarDatos()" [disabled]="guardarSolicitudBoleano"
          class="btn btn-primary col-md-4">
          <i class="fa-solid fa-floppy-disk"></i> Guardar
        </button>
        <button (click)="bsModalRef.hide()" class="btn btn-outline-secondary col-md-4">
          <i class="fa-solid fa-ban" style="color: red"></i> Cerrar
        </button>
      </div>
    </form>
  </div>
</div>
