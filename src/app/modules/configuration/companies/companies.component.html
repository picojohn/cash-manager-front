<div class="view-card">
  <div class="view-header">
    <h3 class="view-title">Empresas</h3>
    <div class="view-search">
      <input type="search" [(ngModel)]="buscador" class="form-control" placeholder="Buscar....">
    </div>
    <button *ngIf="permisionBoolean.INSERT" (click)="newCompany()" class="btn-create">
      <i class="fa-solid fa-plus"></i> Agregar empresa
    </button>
  </div>

  <div style="overflow-x: auto;">
    <table class="modern-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Nombre</th>
          <th *ngIf="permisionBoolean.STATUS">Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let company of filterData() | paginate: {itemsPerPage: totalPaginas, currentPage: page, id: 'itemCompanies'}">
          <td>{{company.id}}</td>
          <td class="td-name">{{company.name}}</td>
          <td *ngIf="permisionBoolean.STATUS">
            <span class="status-badge" (click)="statesCompany(company.id)"
              [ngClass]="company.status == 1 ? 'status-active' : 'status-inactive'">
              <i class="fa-solid" [ngClass]="company.status == 1 ? 'fa-circle-check' : 'fa-circle-xmark'"></i>
              {{company.status == 1 ? 'Activo' : 'Inactivo'}}
            </span>
          </td>
          <td>
            <div class="td-actions">
              <i *ngIf="permisionBoolean.UPDATE" (click)="editCompany(company)" class="fa-solid fa-pen-to-square"></i>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="view-pagination">
    <select class="form-select" (change)="numeroPaginas($event)">
      <option *ngFor="let option of nPaginas" [value]="option" [selected]="option === totalPaginas">{{ option }}</option>
    </select>
    <span *ngIf="filterData().length" class="pagination-info">
      Mostrando <strong>{{ (page - 1) * totalPaginas + 1 }}</strong> - <strong>{{ (page * totalPaginas < filterData().length) ? (page * totalPaginas) : filterData().length }}</strong> de <strong>{{ filterData().length }}</strong>
    </span>
    <pagination-controls id="itemCompanies" (pageChange)="page=$event"
      previousLabel="Anterior" nextLabel="Siguiente"
      style="font-size: 13px; color: var(--text-secondary);">
    </pagination-controls>
  </div>
</div>
