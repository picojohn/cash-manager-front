<div class="container py-5 mt-4">
  <div class="row justify-content-center align-items-center">
    <div class="col-sm-10">
      <div class="card_contenido rounded-4 shadow">
        <div class="row justify-content-center ">
          <div class="col-lg-6 d-none d-lg-flex justify-content-center">
            <img src="/assets/img/img.jpg" alt="Imagen de fondo" class="img-fluid" />
          </div>
          <div class="col-sm-12 col-lg-6">
            <div class="card-body p-md-5 mx-md-4">
              <!-- Language Switcher -->
              <div class="d-flex justify-content-end">
                <div class="lang-selector">
                  <button class="lang-globe-btn" (click)="toggleLangDropdown($event)">
                    <i class="fa-solid fa-globe"></i>
                  </button>
                  <div class="lang-dropdown" *ngIf="langDropdownOpen">
                    <button class="lang-option" [class.lang-active]="currentLang === 'es'" (click)="switchLang('es')">
                      <img src="/assets/img/flag-es.svg" class="lang-flag-img" alt="ES">
                      <span>Español</span>
                    </button>
                    <button class="lang-option" [class.lang-active]="currentLang === 'en'" (click)="switchLang('en')">
                      <img src="/assets/img/flag-us.svg" class="lang-flag-img" alt="EN">
                      <span>English</span>
                    </button>
                  </div>
                </div>
              </div>
              <div class="row col-md-12 justify-content-center mb-4">
                <div class="card col-md-8">
                  <img src="/assets/img/logocash.png" alt="logo">
                </div>
              </div>
              <form [formGroup]="loginForm">
                <p class="text-center">{{ 'AUTH.LOGIN.INFO_MESSAGE' | translate }}</p>

                <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label"><strong>{{ 'AUTH.LOGIN.EMAIL_LABEL' | translate }}</strong></label>
                  <input formControlName="email" type="email" class="form-control" [placeholder]="'AUTH.LOGIN.EMAIL_PLACEHOLDER' | translate" />
                  <div *ngIf="loginForm.controls.email.touched && loginForm.controls.email.errors?.required"
                    class="text text-danger">
                    {{ 'AUTH.LOGIN.EMAIL_REQUIRED' | translate }}
                  </div>
                  <div *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid"
                    class="text text-danger">
                    {{ 'AUTH.LOGIN.EMAIL_INVALID' | translate }}
                  </div>
                </div>

                <div data-mdb-input-init class="form-outline mb-4">
                  <label class="form-label"><strong>{{ 'AUTH.LOGIN.PASSWORD_LABEL' | translate }}</strong></label>
                  <div class="input-password">
                    <input formControlName="password" [type]="showPassword ? 'text' : 'password'" class="form-control" [placeholder]="'AUTH.LOGIN.PASSWORD_PLACEHOLDER' | translate" />
                    <i class="fa-solid eye-toggle" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"
                      (click)="showPassword = !showPassword"></i>
                  </div>
                  <div *ngIf="loginForm.controls.password.touched && loginForm.controls.password.errors?.required"
                    class="text text-danger">
                    {{ 'AUTH.LOGIN.PASSWORD_REQUIRED' | translate }}
                  </div>
                </div>

                <div class="row justify-content-center mb-2">
                  <button (click)="login()" class="btn btn-primary btn-block mb-3 col-md-8"
                    type="button">{{textIniSesssion}}</button>
                </div>

              </form>
              <div class="d-flex align-items-center justify-content-center pb-4">
                <a class="text-muted" href="#!">{{ 'AUTH.LOGIN.FORGOT_PASSWORD' | translate }}</a>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
