<div class="profile-modal" *ngIf="cargarFormulario">

  <!-- Header con avatar -->
  <div class="profile-header">
    <div class="profile-avatar">
      {{ getInitials() }}
    </div>
    <h3 class="profile-name">{{ user?.name }}</h3>
    <span class="profile-email">{{ user?.email }}</span>
  </div>

  <!-- Info cards -->
  <div class="profile-info">
    <div class="info-row">
      <div class="info-item">
        <i class="fa-solid fa-briefcase"></i>
        <div>
          <span class="info-label">Rol</span>
          <strong class="info-value">{{ user?.roleName || 'N/A' }}</strong>
        </div>
      </div>
      <div class="info-item">
        <i class="fa-solid fa-building"></i>
        <div>
          <span class="info-label">Empresa</span>
          <strong class="info-value">{{ user?.companyName || 'N/A' }}</strong>
        </div>
      </div>
    </div>
  </div>

  <!-- Form editable -->
  <form [formGroup]="formProfile" class="profile-form">
    <div class="form-row">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" class="form-control" formControlName="name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" formControlName="email" readonly>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Teléfono</label>
        <input type="number" class="form-control" formControlName="phone" placeholder="Número de teléfono">
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" class="form-control" formControlName="address" placeholder="Dirección">
      </div>
    </div>
  </form>

  <!-- Actions -->
  <div class="profile-actions">
    <button *ngIf="!editMode" class="btn-edit" (click)="toggleEdit()">
      <i class="fa-solid fa-pen-to-square"></i> Editar perfil
    </button>
    <button *ngIf="editMode" class="btn-save" (click)="save()">
      <i class="fa-solid fa-floppy-disk"></i> Guardar
    </button>
    <button *ngIf="editMode" class="btn-cancel" (click)="toggleEdit()">
      <i class="fa-solid fa-xmark"></i> Cancelar
    </button>
    <button class="btn-close-modal" (click)="bsModalRef.hide()">
      Cerrar
    </button>
  </div>

</div>
