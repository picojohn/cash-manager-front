<div class="layout">
  <nav class="sidebar" [ngClass]="{'sidebar-open': isMenuOpen, 'sidebar-collapsed': !isMenuOpen}">

    <!-- Mobile toggle -->
    <div class="sidebar-mobile-toggle" *ngIf="isMobile()">
      <button class="btn-toggle" (click)="toggleMenu()">
        <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-xmark' : 'fa-bars'"></i>
      </button>
    </div>

    <!-- Logo -->
    <div class="sidebar-logo">
      <img src="/assets/img/logocash.jpg" alt="Logo">
    </div>

    <!-- Navigation label -->
    <div class="nav-label">
      <span>NAVEGACIÓN</span>
    </div>

    <!-- Menu items -->
    <div class="nav-menu">
      <div *ngFor="let menu of menuSidebar" class="nav-group">
        <button class="nav-module"
          [class.active]="menu.isOpen"
          (click)="toggleDropdown(menu.idModule)">
          <div class="nav-module-left">
            <i [class]="menu.iconModule" class="nav-icon"></i>
            <span>{{menu.nameModule}}</span>
          </div>
          <i class="fa-solid fa-chevron-down nav-arrow" [class.rotated]="menu.isOpen"></i>
        </button>

        <div class="nav-children" *ngIf="menu.isOpen">
          <a *ngFor="let sub of menu.children"
            class="nav-child"
            routerLink="{{menu.pathModule}}/{{sub.pathSubModule}}"
            routerLinkActive="nav-child-active">
            <span class="nav-dot"></span>
            {{sub.nameSubModule}}
          </a>
        </div>
      </div>
    </div>

  </nav>

  <!-- Main content -->
  <div class="main-content" [ngClass]="{'expanded': isMenuOpen, 'full-width': !isMenuOpen}">
    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-toggle" (click)="toggleMenu()">
          <i class="fa-solid" [ngClass]="isMenuOpen ? 'fa-bars' : 'fa-bars'"></i>
        </button>
      </div>
      <div class="topbar-right">
        <!-- Notifications -->
        <div class="topbar-noti">
          <i class="fa-solid fa-bell" type="button" data-bs-toggle="dropdown" aria-expanded="false"></i>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li *ngFor="let notification of notifications">
              <a class="dropdown-item" href="#">
                <i class="{{ notification.icon }}"></i>&nbsp;&nbsp;{{ notification.message }}
              </a>
            </li>
          </ul>
        </div>

        <!-- User profile -->
        <div class="topbar-user" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="/assets/img/perfil.png" alt="Perfil" />
          <div class="topbar-user-info">
            <strong>{{datosUsuario?.name}}</strong>
            <span>{{datosUsuario?.companyName || 'Sin empresa'}}</span>
          </div>
          <i class="fa-solid fa-caret-down"></i>
        </div>
        <ul class="dropdown-menu dropdown-menu-end shadow">
          <li><a class="dropdown-item" href="#"><i class="fa-solid fa-user"></i> Mi Perfil</a></li>
          <li><a class="dropdown-item" (click)="changePassword(datosUsuario?.id)"><i class="fa-solid fa-key"></i> Cambiar Contraseña</a></li>
          <li><a class="dropdown-item" (click)="openSettings()"><i class="fa-solid fa-palette"></i> Personalizar Tema</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" routerLink="/login"><i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión</a></li>
        </ul>
      </div>
    </header>

    <router-outlet></router-outlet>
  </div>

  <app-settings-panel #settingsPanel></app-settings-panel>
</div>
